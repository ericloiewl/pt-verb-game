<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#fbfbf8">
<script>
(function () {
  var saved = null;
  try { saved = localStorage.getItem("theme"); } catch (e) {}
  var dark = saved === "dark" || (saved !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<title>葡語動詞變位填空</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+HK:wght@100..900&display=swap');
:root {
  color-scheme: light;
  --bg:      oklch(98% 0.004 240);
  --surface: oklch(100% 0 0);
  --fg:      oklch(20% 0.02 240);
  --muted:   oklch(50% 0.018 240);
  --border:  oklch(90% 0.006 240);
  --accent:  oklch(56% 0.12 170);
  --success: oklch(55% 0.15 150);
  --error:   oklch(55% 0.19 27);
  --accent-ink: oklch(30% 0.05 170);
  --on-accent:  oklch(20% 0.04 170);
  --ring:       oklch(56% 0.12 170 / 0.35);
  --ring-soft:  oklch(56% 0.12 170 / 0.18);
  --glow:       oklch(56% 0.12 170 / 0.07);
  --quiet-bg:   color-mix(in oklch, var(--fg) 6%, transparent);
  --quiet-bg-2: color-mix(in oklch, var(--muted) 12%, transparent);
  --ok-bg: oklch(55% 0.15 150 / 0.12);
  --ok-fg: oklch(40% 0.13 150);
  --ko-bg: oklch(55% 0.19 27 / 0.1);
  --ko-fg: oklch(45% 0.17 27);

  --font-display: 'Huninn', 'Noto Sans HK', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --font-body:    'Huninn', 'Noto Sans HK', -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
  --font-mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;

  --radius: 16px;
  --shadow-card: 0 1px 2px oklch(20% 0.02 240 / 0.05), 0 6px 24px oklch(20% 0.02 240 / 0.06);
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --bg:      oklch(19% 0.014 240);
  --surface: oklch(23.5% 0.016 240);
  --fg:      oklch(93% 0.008 240);
  --muted:   oklch(68% 0.014 240);
  --border:  oklch(31% 0.014 240);
  --accent:  oklch(70% 0.12 170);
  --success: oklch(70% 0.14 150);
  --error:   oklch(70% 0.16 27);
  --accent-ink: oklch(85% 0.08 170);
  --on-accent:  oklch(22% 0.05 170);
  --ring:       oklch(70% 0.12 170 / 0.45);
  --ring-soft:  oklch(70% 0.12 170 / 0.25);
  --glow:       oklch(70% 0.12 170 / 0.1);
  --quiet-bg:   color-mix(in oklch, var(--fg) 7%, transparent);
  --quiet-bg-2: color-mix(in oklch, var(--muted) 14%, transparent);
  --ok-bg: oklch(70% 0.14 150 / 0.16);
  --ok-fg: oklch(82% 0.12 150);
  --ko-bg: oklch(70% 0.16 27 / 0.14);
  --ko-fg: oklch(82% 0.13 27);
  --shadow-card: 0 1px 2px oklch(0% 0 0 / 0.35), 0 6px 24px oklch(0% 0 0 / 0.35);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

html, body { height: 100%; }

/* Prevent accidental pinch / double-tap zoom and stray text selection on touch devices.
   `pan-x pan-y` keeps normal scrolling but drops pinch-zoom and double-tap-zoom.
   Text selection stays available on desktop. */
html { touch-action: pan-x pan-y; }

@media (hover: none) and (pointer: coarse) {
  body {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  .chip {
    -webkit-user-select: none;
    user-select: none;
  }
}

input, textarea, [contenteditable] {
  -webkit-user-select: text;
  user-select: text;
}

body {
  font-family: var(--font-body);
  color: var(--fg);
  background-color: var(--bg);
  background-image:
    radial-gradient(90% 34% at 50% 0%, var(--glow), transparent 70%),
    url("confetti-doodles-light.svg");
  background-repeat: no-repeat, repeat;
  background-position: top center, top left;
  background-size: auto, 380px auto;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: clamp(16px, 4vw, 48px) 16px 48px;
  min-height: 100dvh;
}

:root[data-theme="dark"] body {
  background-image:
    radial-gradient(90% 34% at 50% 0%, var(--glow), transparent 70%),
    url("confetti-doodles-dark.svg");
}

.stage {
  width: 100%;
  max-width: 520px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* Header */
.stage-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  padding: 4px 2px 0;
}
.menu { position: relative; flex: none; }
.menu-toggle {
  width: 44px;
  height: 44px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1.5px solid var(--border);
  border-radius: 999px;
  background: var(--surface);
  color: var(--fg);
  cursor: pointer;
  transition: border-color 150ms ease, background-color 150ms ease;
}
.menu-toggle:hover { border-color: var(--accent); }
.menu-toggle:active { transform: translateY(1px); }
.menu-toggle:focus-visible { outline: 3px solid var(--ring); outline-offset: 2px; }
.menu-toggle[aria-expanded="true"] { border-color: var(--accent); color: var(--accent-ink); }
.menu-panel {
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  min-width: 300px;
  max-width: min(380px, calc(100vw - 32px));
  max-height: min(76vh, calc(100dvh - 80px));
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 6px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-card);
  z-index: 20;
}
.menu-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: 46px;
  padding: 0 12px;
  border: 0;
  border-radius: calc(var(--radius) - 6px);
  background: transparent;
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 0.95rem;
  font-weight: 500;
  text-align: left;
  cursor: pointer;
  transition: background-color 150ms ease, color 150ms ease;
}
.menu-item:hover { background: var(--quiet-bg); }
.menu-item:active { transform: translateY(1px); }
.menu-item:focus-visible { outline: 3px solid var(--ring); outline-offset: -2px; }
.menu-item.danger { color: var(--error); }
.menu-item.danger:hover { background: var(--ko-bg); }
.menu-item .menu-icon { flex: none; color: var(--muted); }
.menu-item.danger .menu-icon { color: inherit; }
.menu-label { flex: 1; }
.menu-switch {
  flex: none;
  width: 38px;
  height: 22px;
  padding: 2px;
  border-radius: 999px;
  background: var(--quiet-bg-2);
  transition: background-color 150ms ease;
}
.menu-switch::after {
  content: "";
  display: block;
  width: 18px;
  height: 18px;
  border-radius: 999px;
  background: var(--surface);
  box-shadow: 0 1px 2px oklch(20% 0.02 240 / 0.25);
  transition: transform 150ms ease;
}
.menu-item[aria-checked="true"] .menu-switch { background: var(--accent); }
.menu-item[aria-checked="true"] .menu-switch::after { transform: translateX(16px); }
.menu-view { display: flex; flex-direction: column; gap: 2px; }
.menu-item .menu-chev { flex: none; color: var(--muted); }
.menu-item:hover .menu-chev { color: var(--accent); }
.menu-count {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  font-size: 0.85rem;
  color: var(--muted);
}
.menu-count.warn { color: var(--error); font-weight: 500; }
.menu-back {
  gap: 6px;
  min-height: 38px;
  margin-bottom: 4px;
  color: var(--muted);
  font-size: 0.85rem;
}
.menu-back:hover { color: var(--fg); }
.menu-back .menu-icon { color: inherit; }
#menuTenseView .tense-groups { padding: 6px 8px 4px; border-top: 0; }
#menuTenseView .chip { min-height: 38px; padding: 0 12px; font-size: 0.85rem; }
.stage-title {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: clamp(1.5rem, 6vw, 1.9rem);
  letter-spacing: -0.02em;
  line-height: 1.15;
}
.stage-sub {
  margin-top: 6px;
  color: var(--muted);
  font-size: 0.85rem;
  letter-spacing: 0.02em;
}

/* Tense filter (rendered inside the settings submenu) */
.tense-groups {
  padding: 14px 16px 16px;
  border-top: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.tense-group { display: flex; flex-direction: column; gap: 8px; }
.tense-group-title {
  font-size: 0.72rem;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
}
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip-btn { display: inline-flex; }
.chip-btn input { position: absolute; opacity: 0; width: 0; height: 0; }
.chip {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  padding: 0 16px;
  border-radius: 999px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  color: var(--fg);
  font-size: 0.95rem;
  font-weight: 500;
  cursor: pointer;
  transition: background-color 150ms ease, border-color 150ms ease, color 150ms ease, box-shadow 150ms ease;
}
.chip-btn input:focus-visible + .chip { outline: 3px solid var(--ring); outline-offset: 2px; }
.chip-btn input:checked + .chip {
  background: color-mix(in oklch, var(--accent), var(--surface) 82%);
  border-color: color-mix(in oklch, var(--accent), var(--fg) 30%);
  color: var(--accent-ink);
}
.chip-btn:hover .chip { border-color: color-mix(in oklch, var(--accent), var(--border) 40%); }
.chip-btn:active .chip { transform: translateY(1px); }

/* Question card */
.question-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-card);
  padding: clamp(20px, 5vw, 28px);
  display: flex;
  flex-direction: column;
  gap: 14px;
  min-height: 260px;
}
.q-meta { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
.q-tense {
  font-size: 0.75rem;
  font-weight: 500;
  line-height: 1.35;
  letter-spacing: 0.03em;
  color: var(--muted);
  text-wrap: pretty;
}
.mini-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  border-radius: 999px;
  font-size: 0.9rem;
  font-weight: 500;
  line-height: 1.2;
}
.q-verb {
  font-family: var(--font-display);
  font-size: clamp(1.4rem, 6vw, 1.9rem);
  font-weight: 500;
  line-height: 1.1;
  letter-spacing: -0.01em;
  color: var(--accent-ink);
}
.mini-chip.person { background: var(--quiet-bg-2); color: var(--muted); }

.q-sentence {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: clamp(1.2rem, 5.2vw, 1.65rem);
  line-height: 1.5;
  letter-spacing: -0.01em;
  word-break: break-word;
}
.blank {
  display: inline-block;
  min-width: 48px;
  padding: 0 6px;
  border-bottom: 3px dashed var(--accent);
  background: color-mix(in oklch, var(--accent), var(--surface) 88%);
  color: var(--accent-ink);
  line-height: 1.15;
  white-space: nowrap;
}
.blank-ghost { visibility: hidden; }
.blank.ok {
  border-bottom-color: var(--success);
  background: var(--ok-bg);
  color: var(--ok-fg);
}
.blank.ko {
  border-bottom-color: var(--error);
  background: var(--ko-bg);
  color: var(--ko-fg);
}
.q-hint { display: flex; flex-wrap: wrap; gap: 6px; }
.hint-chip {
  display: inline-flex;
  align-items: center;
  padding: 3px 10px;
  border-radius: 999px;
  background: var(--quiet-bg-2);
  color: var(--muted);
  font-size: 0.78rem;
  font-weight: 500;
  line-height: 1.4;
  white-space: nowrap;
}
.inline-alert { color: var(--error); font-size: 0.85rem; font-weight: 500; }

/* Answer row */
.answer-row { display: flex; gap: 10px; }
.answer-row input {
  flex: 1;
  min-width: 0;
  min-height: 52px;
  padding: 0 16px;
  border: 1.5px solid var(--border);
  border-radius: 14px;
  font-family: var(--font-body);
  font-size: 16px;
  color: var(--fg);
  background: var(--surface);
  transition: border-color 150ms ease, box-shadow 150ms ease;
}
.answer-row input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--ring-soft);
}
.answer-row input:disabled { background: var(--bg); color: var(--muted); }
.answer-row button {
  min-height: 52px;
  min-width: 104px;
  padding: 0 22px;
  border: 0;
  border-radius: 14px;
  background: var(--accent);
  color: var(--on-accent);
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 1rem;
  cursor: pointer;
  box-shadow: 0 3px 0 color-mix(in oklch, var(--accent), var(--fg) 20%);
  transition: background-color 150ms ease, transform 80ms ease, box-shadow 80ms ease;
}
.answer-row button:hover { background: color-mix(in oklch, var(--accent), var(--fg) 10%); }
.answer-row button:active { transform: translateY(2px); box-shadow: 0 1px 0 color-mix(in oklch, var(--accent), var(--fg) 20%); }
.answer-row button:focus-visible { outline: 3px solid var(--ring); outline-offset: 2px; }

/* Answer zone: feedback and reveal share one slot so toggling causes no shift */
.answer-zone { display: grid; gap: 6px; }
.answer-zone > * { grid-area: 1 / 1; }
.answer-zone.is-stacked .reveal-btn { grid-area: 2 / 1; align-self: start; }
.reveal-btn {
  justify-self: center;
  align-self: center;
  min-height: 40px;
  padding: 0 14px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: var(--muted);
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 0.85rem;
  text-decoration: underline;
  text-underline-offset: 3px;
  cursor: pointer;
  transition: color 150ms ease;
}
.reveal-btn:hover { color: var(--fg); }
.reveal-btn:focus-visible { outline: 3px solid var(--ring); outline-offset: 2px; }
.reveal-btn.is-hidden { visibility: hidden; }

/* Feedback */
.feedback {
  min-height: 3.2em;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  border-radius: 12px;
  font-size: 0.95rem;
  font-weight: 500;
  line-height: 1.4;
}
.feedback.ok { background: var(--ok-bg); color: var(--ok-fg); }
.feedback.ko { background: var(--ko-bg); color: var(--ko-fg); }
.feedback.empty { background: transparent; color: var(--muted); }
.feedback .ans { font-family: var(--font-mono); font-weight: 500; }

/* Score */
.score {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 8px;
  padding-top: 14px;
  border-top: 1px solid var(--border);
  color: var(--muted);
  font-size: 0.9rem;
}
.score b { color: var(--fg); font-variant-numeric: tabular-nums; font-family: var(--font-mono); font-size: 1rem; }
.score .streak { color: var(--accent-ink); }
.score .streak b { color: inherit; }
.score .acc { margin-left: auto; color: var(--fg); font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* Empty state */
.empty-state {
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: flex-start;
  justify-content: center;
  flex: 1;
}
.empty-state h2 {
  font-family: var(--font-display);
  font-size: 1.25rem;
  font-weight: 500;
  letter-spacing: -0.01em;
}
.empty-state p { color: var(--muted); font-size: 0.92rem; line-height: 1.55; }
.empty-state button {
  margin-top: 6px;
  min-height: 48px;
  padding: 0 20px;
  border: 0;
  border-radius: 14px;
  background: var(--accent);
  color: var(--on-accent);
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 0.98rem;
  cursor: pointer;
  box-shadow: 0 3px 0 color-mix(in oklch, var(--accent), var(--fg) 20%);
  transition: background-color 150ms ease, transform 80ms ease;
}
.empty-state button:hover { background: color-mix(in oklch, var(--accent), var(--fg) 10%); }
.empty-state button:active { transform: translateY(2px); box-shadow: 0 1px 0 color-mix(in oklch, var(--accent), var(--fg) 20%); }

/* Pixel cat mascot */
.question-card { position: relative; padding-bottom: clamp(88px, 23vw, 116px); opacity: 0.8; }
.cat {
  --cat-line: var(--fg);
  --cat-fill: color-mix(in oklch, var(--fg) 12%, var(--surface));
  --cat-stripe: color-mix(in oklch, var(--fg) 42%, var(--surface));
  --cat-blush: oklch(86% 0.06 5);
  --cat-pink: oklch(78% 0.11 5);
  position: absolute;
  right: 16px;
  bottom: 10px;
  width: clamp(76px, 20vw, 104px);
  pointer-events: none;
  z-index: 1;
}
:root[data-theme="dark"] .cat {
  --cat-blush: oklch(76% 0.08 5);
  --cat-pink: oklch(75% 0.11 5);
}
.cat svg { display: block; width: 100%; height: auto; overflow: visible; transform-origin: 50% 100%; }
.c-line { fill: var(--cat-line); }
.c-fill { fill: var(--cat-fill); }
.c-stripe { fill: var(--cat-stripe); }
.c-blush { fill: var(--cat-blush); }
.c-pink { fill: var(--cat-pink); }
.c-accent { fill: var(--accent); }
.c-zzz { fill: var(--muted); }
.cat [data-m] { display: none; }
.cat[data-mood="idle"]  [data-m="eyes-open"],
.cat[data-mood="happy"] [data-m="eyes-happy"],
.cat[data-mood="star"]  [data-m="eyes-star"],
.cat[data-mood="star"]  [data-m="hearts"],
.cat[data-mood="sad"]   [data-m="eyes-open"],
.cat[data-mood="sad"]   [data-m="tear"],
.cat[data-mood="sleep"] [data-m="eyes-sleep"],
.cat[data-mood="sleep"] [data-m="zzz"] { display: block; }
.ear, .tail { transform-box: fill-box; transform-origin: 50% 100%; }
.ear { transition: transform 260ms ease; }
.cat[data-mood="sad"] .ear-l { transform: rotate(-22deg); }
.cat[data-mood="sad"] .ear-r { transform: rotate(22deg); }
.cat[data-mood="idle"] { animation: cat-idle-bob 3.2s ease-in-out infinite; }
.cat[data-mood="idle"] .tail { animation: tail-sway 2.2s ease-in-out infinite alternate; }
@keyframes tail-sway {
  from { transform: rotate(-10deg); }
  to   { transform: rotate(10deg); }
}
.cat.pop svg { animation: cat-pop 500ms cubic-bezier(.34, 1.56, .64, 1); }
.cat.pop[data-mood="happy"] svg { animation: cat-bounce 560ms cubic-bezier(.34, 1.56, .64, 1); }
.cat.pop[data-mood="star"]  svg { animation: cat-cheer 640ms cubic-bezier(.34, 1.56, .64, 1); }
.cat.pop[data-mood="sad"]   svg { animation: cat-shake 520ms ease; }
.cat.pop[data-mood="sleep"] svg { animation: cat-breathe 2.4s ease-in-out infinite; }
@keyframes cat-pop {
  0%   { transform: translateY(6px) scale(.82); }
  55%  { transform: translateY(-5px) scale(1.12); }
  100% { transform: translateY(0) scale(1); }
}
@keyframes cat-bounce {
  0%   { transform: translateY(0) scale(1); }
  30%  { transform: translateY(-9px) scale(1.06, .95); }
  55%  { transform: translateY(0) scale(1.06, .93); }
  75%  { transform: translateY(-4px) scale(1.02, 1); }
  100% { transform: translateY(0) scale(1); }
}
@keyframes cat-cheer {
  0%   { transform: scale(.8) rotate(-8deg); }
  45%  { transform: scale(1.18) rotate(6deg); }
  70%  { transform: scale(1.04) rotate(-3deg); }
  100% { transform: scale(1) rotate(0); }
}
@keyframes cat-shake {
  0%   { transform: translateY(0) rotate(0); }
  20%  { transform: translateY(2px) rotate(-6deg); }
  40%  { transform: translateY(2px) rotate(6deg); }
  60%  { transform: translateY(2px) rotate(-4deg); }
  80%  { transform: translateY(1px) rotate(3deg); }
  100% { transform: translateY(0) rotate(0); }
}
@keyframes cat-breathe {
  0%, 100% { transform: scale(1); }
  50%      { transform: scale(1.05); }
}
@keyframes cat-idle-bob {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-2px); }
}
.cat[data-mood="idle"] [data-m="eyes-open"] { animation: cat-blink 4.5s ease-in-out infinite; }
@keyframes cat-blink {
  0%, 90%, 100% { opacity: 1; }
  94%           { opacity: 0; }
}
.cat[data-mood="star"] [data-m="eyes-star"] {
  transform-box: fill-box;
  transform-origin: center;
  animation: eye-twinkle 1.1s ease-in-out infinite;
}
@keyframes eye-twinkle {
  0%, 100% { opacity: 1; transform: scale(1); }
  50%      { opacity: .55; transform: scale(.8); }
}
.cat[data-mood="star"] [data-m="hearts"] .heart { animation: heart-rise 1.6s ease-out infinite; }
.cat[data-mood="star"] [data-m="hearts"] > g:nth-child(2) .heart { animation-delay: .5s; }
@keyframes heart-rise {
  0%   { transform: translateY(0); opacity: 0; }
  20%  { opacity: 1; }
  100% { transform: translateY(-9px); opacity: 0; }
}
.cat[data-mood="sad"] [data-m="tear"] { animation: tear-fall 1.3s ease-in infinite; }
@keyframes tear-fall {
  0%   { transform: translateY(0); opacity: 0; }
  15%  { opacity: 1; }
  70%  { transform: translateY(4px); opacity: 1; }
  100% { transform: translateY(7px); opacity: 0; }
}
.cat[data-mood="sleep"] [data-m="zzz"] { animation: zzz-drift 2.4s ease-in-out infinite; }
@keyframes zzz-drift {
  0%   { transform: translate(0, 0); opacity: .2; }
  40%  { opacity: 1; }
  100% { transform: translate(2px, -4px); opacity: 0; }
}

/* Mobile: pin the answer bar (input + submit/next) to the bottom of the viewport */
@media (max-width: 640px) {
  html, body { overflow: hidden; }
  body { align-items: stretch; padding: 0; }
  /* Shell matches the visible viewport (visualViewport.height via --app-vh)
     so the focused input can never scroll the question out of view. */
  .stage {
    height: var(--app-vh, 100dvh);
    min-height: 0;
    padding: calc(16px + env(safe-area-inset-top))
             calc(16px + env(safe-area-inset-right))
             0
             calc(16px + env(safe-area-inset-left));
    gap: 14px;
  }
  .answer-row {
    order: 10;
    position: sticky;
    bottom: 0;
    margin: auto calc(-16px - env(safe-area-inset-right)) 0 calc(-16px - env(safe-area-inset-left));
    padding: 12px
             calc(16px + env(safe-area-inset-right))
             calc(12px + env(safe-area-inset-bottom))
             calc(16px + env(safe-area-inset-left));
    background: var(--bg);
    border-top: 1px solid var(--border);
    box-shadow: 0 -6px 18px oklch(20% 0.02 240 / 0.06);
    z-index: 5;
  }
  [data-theme="dark"] .answer-row { box-shadow: 0 -6px 18px oklch(0% 0 0 / 0.4); }
  /* The question card is the only flexible/scrolling region; it keeps the
     question pinned at its top while the input bar stays at the bottom. */
  .question-card {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
  }
  .score { margin-bottom: 6px; }

  /* Tense submenu goes fullscreen on phones for easy reading and tapping */
  .menu-panel.is-tense {
    position: fixed;
    inset: 0;
    min-width: 0;
    max-width: none;
    max-height: none;
    border: 0;
    border-radius: 0;
    padding: calc(14px + env(safe-area-inset-top))
             calc(16px + env(safe-area-inset-right))
             calc(14px + env(safe-area-inset-bottom))
             calc(16px + env(safe-area-inset-left));

  }

    margin-bottom: 8px;

  .menu-panel.is-tense #menuTenseView .tense-groups { padding: 8px 2px 4px; gap: 18px; }
  .menu-panel.is-tense #menuTenseView .chips {

    justify-content: flex-start;
    text-align: left;
    white-space: normal;
    overflow-wrap: anywhere;
  }

     open): drop the tall decorative parts so the question + input both fit. */
  html.compact .stage { height: var(--app-vh, 100dvh); gap: 10px; }
  html.compact .stage-title,

  html.compact .stage-head { justify-content: flex-end; }

    padding-bottom: calc(10px + env(safe-area-inset-bottom));

}

<script>
const verbData = Array.isArray(window.VERB_DATA) ? window.VERB_DATA : [];

const PERSON = ["eu", "tu", "ele/ela/você", "nós", "eles/elas/vocês"];
const PERSON_DISPLAY = {
  "eu": ["eu"],
  "tu": ["tu"],
  "ele/ela/você": ["ele", "ela", "você"],
  "nós": ["nós"],
  "eles/elas/vocês": ["eles", "elas", "vocês"]
};
const REFLEXIVE_PRONOUN = {
  "eu": "me",
  "tu": "te",
  "ele/ela/você": "se",
  "nós": "nos",
  "eles/elas/vocês": "se"
};
const BLANK_TOKEN = "@@VERB@@";
const TENSE_LABEL = {
  presente: "presente · 現在式",
  preterito_perfeito: "pretérito perfeito · 簡單過去式",
  preterito_imperfeito: "pretérito imperfeito · 過去未完成式",
  futuro_presente: "futuro do presente · 未來式",
  condicional: "condicional · 條件式",
  presente_subjuntivo: "presente do conjuntivo · 現在虛擬式",
  preterito_imperfeito_subjuntivo: "pretérito imperfeito do conjuntivo · 過去未完成虛擬式",
  imperativo_afirmativo: "imperativo afirmativo · 肯定命令式"
};
const TENSE_META = {
  presente:                          { short: "presente",              mood: "indicativo" },
  preterito_perfeito:                { short: "pret. perfeito",        mood: "indicativo" },
  preterito_imperfeito:              { short: "pret. imperfeito",      mood: "indicativo" },
  futuro_presente:                   { short: "fut. presente",         mood: "indicativo" },
  condicional:                       { short: "condicional",           mood: "indicativo" },
  presente_subjuntivo:               { short: "pres. subjuntivo",      mood: "conjuntivo" },
  preterito_imperfeito_subjuntivo:   { short: "pret. imp. subjuntivo", mood: "conjuntivo" },
  imperativo_afirmativo:             { short: "imper. afirmativo",     mood: "imperativo" }
};
const MOOD_ORDER = ["indicativo", "conjuntivo", "imperativo", "outros"];
const MOOD_LABEL = {
  indicativo: "Indicativo",
  conjuntivo: "Conjuntivo",
  imperativo: "Imperativo",
  outros: "Outros"
};
const langLabel = k => TENSE_LABEL[k] || k.replace(/_/g, " ");
const tenseMeta = k => TENSE_META[k] || { short: k.replace(/_/g, " "), mood: "outros" };

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
}[c]));
const rand = n => Math.floor(Math.random() * n);
const norm = s => String(s).normalize("NFC").replace(/[\s-]+/g, "").toLowerCase();
const tenseKeys = () => [...new Set(Object.values(verbData).flatMap(v => Object.keys(v.tenses || {})))];

const STORE_KEY = { checked: "ptvg.checked", stats: "ptvg.stats" };
function readStore(key, fallback) {
  try { const raw = localStorage.getItem(key); return raw == null ? fallback : JSON.parse(raw); }
  catch (e) { return fallback; }
}
function writeStore(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
}

const allTenseKeys = tenseKeys();
const savedChecked = readStore(STORE_KEY.checked, null);
const savedStats = readStore(STORE_KEY.stats, null);

const state = {
  checked: Array.isArray(savedChecked)
    ? new Set(savedChecked.filter(k => allTenseKeys.includes(k)))
    : new Set(allTenseKeys),
  correct: savedStats && Number.isFinite(savedStats.correct) ? savedStats.correct : 0,
  total: savedStats && Number.isFinite(savedStats.total) ? savedStats.total : 0,
  current: null,
  locked: false,
  streak: 0,
  lastKey: null
};

const els = {
  chips: $("tenseChips"), count: $("tenseCount"),
  qMeta: $("qMeta"), qSentence: $("qSentence"), qHint: $("qHint"),
  empty: $("emptyState"), emptyTitle: $("emptyTitle"), emptyBody: $("emptyBody"),
  checkAll: $("checkAllBtn"),
  form: $("answerForm"), input: $("answerInput"), action: $("submitBtn"),
  reveal: $("revealBtn"), srStatus: $("srStatus"),
  feedback: $("feedback"), feedbackText: $("feedbackText"), answerZone: $("answerZone"),
  correctEl: $("scoreCorrect"), totalEl: $("scoreTotal"), accEl: $("accuracy"),
  streakWrap: $("streakWrap"), streakEl: $("scoreStreak"),
  cat: $("pixelCat")
};

function setMood(mood) {
  if (!els.cat) return;
  els.cat.dataset.mood = mood;
  els.cat.classList.remove("pop");
  void els.cat.offsetWidth;
  els.cat.classList.add("pop");
}

function showReveal(visible) {
  if (els.reveal) els.reveal.classList.toggle("is-hidden", !visible);
}

function updateTenseCount() {
  els.count.textContent = `已選 ${state.checked.size}/${tenseKeys().length}`;
  els.count.classList.toggle("warn", state.checked.size === 0);
}

function renderTenseChips() {
  const groups = new Map();
  tenseKeys().forEach(k => {
    const mood = tenseMeta(k).mood;
    if (!groups.has(mood)) groups.set(mood, []);
    groups.get(mood).push(k);
  });
  els.chips.innerHTML = MOOD_ORDER.filter(m => groups.has(m)).map(m => {
    const chips = groups.get(m).map(k => {
      const checked = state.checked.has(k) ? "checked" : "";
      return `<label class="chip-btn">
        <input type="checkbox" value="${esc(k)}" ${checked} data-tense>
        <span class="chip" title="${esc(langLabel(k))}">${esc(langLabel(k))}</span>
      </label>`;
    }).join("");
    return `<div class="tense-group">
      <h2 class="tense-group-title">${esc(MOOD_LABEL[m])}</h2>
      <div class="chips">${chips}</div>
    </div>`;
  }).join("");
  updateTenseCount();
}
els.chips.addEventListener("change", (e) => {
  if (e.target.matches("[data-tense]")) {
    if (e.target.checked) state.checked.add(e.target.value);
    else state.checked.delete(e.target.value);
    writeStore(STORE_KEY.checked, [...state.checked]);
    updateTenseCount();
    refreshGame();
  }
});

function pickSubject(person) {
  const pool = PERSON_DISPLAY[person];
  return Array.isArray(pool) && pool.length ? pool[rand(pool.length)] : person;
}

function fillTemplate(template, vars) {
  return template
    .split("{verb}")
    .map(part => part
      .replace(/\{time_marker\}/g, vars.timeMarker)
      .replace(/\{subject\}/g, vars.subject)
      .replace(/\{object\}/g, vars.object)
      .replace(/\{reflexive_pronoun\}/g, vars.reflexive))
    .join(BLANK_TOKEN);
}

function cleanSentence(s) {
  const cleaned = s
    .replace(/\s{2,}/g, " ")
    .replace(/\s+([.,!?;:])/g, "$1")
    .trim();
  return cleaned.charAt(0).toUpperCase() + cleaned.slice(1);
}

function buildQuestion(verb, tk, person, idx) {
  const t = verb && verb.tenses ? verb.tenses[tk] : null;
  if (!t) return null;
  const conj = t.conjugations ? t.conjugations[person] : undefined;
  if (typeof conj !== "string" || !conj) return null;

  const special = Array.isArray(t.special_templates) ? t.special_templates.filter(Boolean) : [];
  const generic = typeof verb.sentence_template === "string" && verb.sentence_template ? [verb.sentence_template] : [];
  const templates = special.length ? special : generic;
  if (!templates.length) return null;

  const objects = Array.isArray(verb.objects) ? verb.objects : [];
  const markers = Array.isArray(t.time_markers) ? t.time_markers : [];
  const vars = {
    timeMarker: markers.length ? markers[rand(markers.length)] : "",
    subject: pickSubject(person),
    object: objects.length ? objects[rand(objects.length)] : "",
    reflexive: REFLEXIVE_PRONOUN[person] || ""
  };

  const sentence = cleanSentence(fillTemplate(templates[rand(templates.length)], vars));
  return {
    verb: verb.infinitive,
    tense: tk,
    index: idx,
    sentence,
    answer: conj,
    translation: (verb.translation_zh || "").split("；").map(s => s.trim()).filter(Boolean)
  };
}

function questionKey(q) {
  return `${q.verb}|${q.tense}|${q.index}`;
}

function pickQuestion() {
  if (!verbData.length) return null;
  let fallback = null;
  let tries = 100;
  while (tries-- > 0) {
    const verb = verbData[rand(verbData.length)];
    const tkeys = Object.keys(verb.tenses || {}).filter(k => state.checked.has(k));
    if (!tkeys.length) continue;
    const tk = tkeys[rand(tkeys.length)];
    const idx = rand(PERSON.length);
    const q = buildQuestion(verb, tk, PERSON[idx], idx);
    if (q) {
      if (questionKey(q) !== state.lastKey) return q;
      if (!fallback) fallback = q;
    }
  }
  if (fallback) return fallback;
  let onlyOption = null;
  for (const verb of verbData) {
    for (const tk of Object.keys(verb.tenses || {})) {
      if (!state.checked.has(tk)) continue;
      for (let idx = 0; idx < PERSON.length; idx++) {
        const q = buildQuestion(verb, tk, PERSON[idx], idx);
        if (!q) continue;
        if (questionKey(q) !== state.lastKey) return q;
        if (!onlyOption) onlyOption = q;
      }
    }
  }
  return onlyOption;
}

function setFeedback(cls, text) {
  els.feedback.className = "feedback " + cls;
  els.feedbackText.textContent = text;
}

function renderQuestion(q) {
  const blank = `<span class="blank"></span>`;
  els.qMeta.innerHTML =
    `<span class="q-tense">${esc(langLabel(q.tense))}</span>` +
    `<span class="q-verb">${esc(q.verb)}</span>`;
  els.qSentence.innerHTML = esc(q.sentence).replace(BLANK_TOKEN, blank);
  els.blank = els.qSentence.querySelector(".blank");
  const ghost = document.createElement("span");
  ghost.className = "blank-ghost";
  ghost.setAttribute("aria-hidden", "true");
  ghost.textContent = q.answer;
  els.blank.appendChild(ghost);
  els.qHint.innerHTML = (q.translation || [])
    .map(s => `<span class="hint-chip">${esc(s)}</span>`)
    .join("");
  els.qMeta.hidden = false;
  els.qHint.hidden = !(q.translation && q.translation.length);
  els.empty.hidden = true;
  els.form.hidden = false;
  els.feedback.className = "feedback empty";
  els.feedbackText.textContent = "";
  els.answerZone.classList.remove("is-stacked");
  els.input.value = "";
  els.input.disabled = false;
  els.action.textContent = "送出";
  state.locked = false;
  state.lastKey = questionKey(q);
  showReveal(true);
  if (els.srStatus) {
    els.srStatus.textContent = `新題目：${q.verb}，${langLabel(q.tense)}。${q.sentence.replace(BLANK_TOKEN, "空白")}`;
  }
  setMood("idle");
  window.setTimeout(() => els.input.focus(), 0);
}

function showEmpty(title, body, fbText) {
  els.emptyTitle.textContent = title;
  els.emptyBody.textContent = body;
  els.empty.hidden = false;
  els.qMeta.hidden = true;
  els.qSentence.textContent = "";
  els.qHint.hidden = true;
  els.form.hidden = true;
  els.feedback.className = "feedback empty";
  els.feedbackText.textContent = fbText || "請從選單的「出題時態」至少勾選一個時態。";
  els.answerZone.classList.remove("is-stacked");
  showReveal(false);
  setMood("sleep");
}

function updateScore() {
  els.correctEl.textContent = state.correct;
  els.totalEl.textContent = state.total;
  els.accEl.textContent = state.total
    ? Math.round((state.correct / state.total) * 100) + "% 正確率"
    : "–";
  if (els.streakWrap) {
    els.streakEl.textContent = state.streak;
    els.streakWrap.hidden = state.streak <= 0;
  }
  writeStore(STORE_KEY.stats, { correct: state.correct, total: state.total });
}

function refreshGame() {
  if (!verbData.length) { state.current = null; showEmpty("資料載入失敗", "無法讀取 verb-data.js。請確認它與 verb-game.html 位於同一資料夾，然後重新載入頁面。", "資料檔遺失或格式錯誤。"); updateScore(); return; }
  if (state.checked.size === 0) { state.current = null; showEmpty("還沒有勾選時態", "打開右上角選單的「出題時態」，至少勾選一個時態，遊戲才能出題。"); updateScore(); return; }
  const q = pickQuestion();
  if (!q) { state.current = null; showEmpty("沒有可用題目", "目前勾選的時態缺少可出題的動詞資料，請勾選其他時態。"); updateScore(); return; }
  state.current = q;
  renderQuestion(q);
  updateScore();
}

function submitAnswer() {
  if (state.locked || !state.current) return;
  const raw = els.input.value;
  if (!raw.trim()) {
    els.feedback.className = "feedback ko";
    els.feedbackText.textContent = "欄位是空的——請先輸入答案。";
    els.answerZone.classList.add("is-stacked");
    els.input.focus();
    return;
  }
  const okay = norm(raw) === norm(state.current.answer);
  state.total += 1;
  els.blank.textContent = state.current.answer;
  els.blank.classList.add(okay ? "ok" : "ko");
  if (okay) {
    state.correct += 1;
    state.streak += 1;
    setMood(state.streak >= 3 ? "star" : "happy");
    setFeedback("ok", `✓ 正確！答對 ${state.correct} / ${state.total}。`);
  } else {
    state.streak = 0;
    setMood("sad");
    els.feedback.className = "feedback ko";
    els.feedbackText.innerHTML = `✕ 答錯。正確答案：<span class="ans">${esc(state.current.answer)}</span>`;
  }
  state.locked = true;
  els.input.disabled = true;
  els.action.textContent = "下一題 →";
  els.answerZone.classList.remove("is-stacked");
  showReveal(false);
  updateScore();
  els.action.focus();
}

function revealAnswer() {
  if (state.locked || !state.current) return;
  state.total += 1;
  state.streak = 0;
  els.blank.textContent = state.current.answer;
  els.blank.classList.remove("ok");
  els.blank.classList.add("ko");
  setMood("sad");
  els.feedback.className = "feedback ko";
  els.feedbackText.innerHTML = `✕ 已看答案。正確答案：<span class="ans">${esc(state.current.answer)}</span>`;
  state.locked = true;
  els.input.disabled = true;
  els.action.textContent = "下一題 →";
  els.answerZone.classList.remove("is-stacked");
  showReveal(false);
  updateScore();
  els.action.focus();
}

function nextQuestion() {
  if (!state.checked.size) { refreshGame(); return; }
  const q = pickQuestion();
  if (q) { state.current = q; renderQuestion(q); updateScore(); }
  else refreshGame();
}

els.form.addEventListener("submit", (e) => {
  e.preventDefault();
  if (state.locked) nextQuestion();
  else submitAnswer();
});
els.input.addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  e.preventDefault();
  if (state.locked) nextQuestion();
  else submitAnswer();
});
els.input.addEventListener("input", () => {
  if (state.locked || !state.current) return;
  if (els.feedbackText.textContent) {
    els.feedback.className = "feedback empty";
    els.feedbackText.textContent = "";
    els.answerZone.classList.remove("is-stacked");
  }
});
els.reveal.addEventListener("click", revealAnswer);
els.checkAll.addEventListener("click", () => {
  tenseKeys().forEach(k => state.checked.add(k));
  writeStore(STORE_KEY.checked, [...state.checked]);
  renderTenseChips();
  refreshGame();
});

const menuRoot = $("settingsMenu");
const menuToggle = $("menuToggle");
const menuPanel = $("menuPanel");
const menuMainView = $("menuMainView");
const menuTenseView = $("menuTenseView");
const tenseItem = $("tenseItem");
const menuBackBtn = $("menuBackBtn");
const themeItem = $("themeItem");
const resetStatsItem = $("resetStatsItem");
const themeMeta = document.querySelector('meta[name="theme-color"]');
const THEME_COLOR = { light: "#fbfbf8", dark: "#20242a" };
const systemDark = window.matchMedia("(prefers-color-scheme: dark)");

function visibleMenuItems() {
  const view = menuTenseView.hidden ? menuMainView : menuTenseView;
  return [...view.querySelectorAll(".menu-item")];
}

function showTenseView() {
  menuMainView.hidden = true;
  menuTenseView.hidden = false;
  menuPanel.classList.add("is-tense");
  tenseItem.setAttribute("aria-expanded", "true");
  menuBackBtn.focus();
}

function showMainView(focusTense) {
  menuTenseView.hidden = true;
  menuMainView.hidden = false;
  menuPanel.classList.remove("is-tense");
  tenseItem.setAttribute("aria-expanded", "false");
  if (focusTense) tenseItem.focus();
}

function openMenu() {
  if (!menuPanel.hidden) return;
  showMainView(false);
  menuPanel.hidden = false;
  menuToggle.setAttribute("aria-expanded", "true");
  const first = visibleMenuItems()[0];
  if (first) first.focus();
}

function closeMenu(returnFocus) {
  if (menuPanel.hidden) return;
  menuPanel.hidden = true;
  menuToggle.setAttribute("aria-expanded", "false");
  showMainView(false);
  if (returnFocus) menuToggle.focus();
}

menuToggle.addEventListener("click", () => {
  if (menuPanel.hidden) openMenu();
  else closeMenu(false);
});
tenseItem.addEventListener("click", showTenseView);
menuBackBtn.addEventListener("click", () => showMainView(true));

document.addEventListener("click", (e) => {
  if (!menuPanel.hidden && !menuRoot.contains(e.target)) closeMenu(false);
});

document.addEventListener("keydown", (e) => {
  if (menuPanel.hidden) return;
  if (e.key === "Escape") {
    e.preventDefault();
    if (!menuTenseView.hidden) showMainView(true);
    else closeMenu(true);
    return;
  }
  if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
  const items = visibleMenuItems();
  const idx = items.indexOf(document.activeElement);
  if (idx === -1) return;
  e.preventDefault();
  const next = e.key === "ArrowDown"
    ? (idx + 1) % items.length
    : (idx - 1 + items.length) % items.length;
  items[next].focus();
});

function applyTheme(dark) {
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  try { localStorage.setItem("theme", dark ? "dark" : "light"); } catch (e) {}
  syncThemeChrome();
}

function syncThemeChrome() {
  const dark = document.documentElement.dataset.theme === "dark";
  if (themeItem) {
    themeItem.setAttribute("aria-checked", dark ? "true" : "false");
    const label = dark ? "深色模式：開啟" : "深色模式：關閉";
    themeItem.setAttribute("aria-label", label);
    themeItem.setAttribute("title", label);
  }
  if (themeMeta) themeMeta.setAttribute("content", THEME_COLOR[dark ? "dark" : "light"]);
}

themeItem.addEventListener("click", () => {
  applyTheme(document.documentElement.dataset.theme !== "dark");
});

resetStatsItem.addEventListener("click", () => {
  if (!window.confirm("確定要重設答題次數與正確率嗎？此動作無法復原。")) return;
  state.correct = 0;
  state.total = 0;
  state.streak = 0;
  updateScore();
  closeMenu(true);
});

systemDark.addEventListener("change", (e) => {
  let saved = null;
  try { saved = localStorage.getItem("theme"); } catch (err) {}
  if (saved === "dark" || saved === "light") return;
  document.documentElement.dataset.theme = e.matches ? "dark" : "light";
  syncThemeChrome();
});

syncThemeChrome();

const phoneMQ = window.matchMedia("(max-width: 640px)");
const vv = window.visualViewport;
let fullHeight = Math.max(window.innerHeight, vv ? vv.height : 0);
let lastWidth = window.innerWidth;
const root = document.documentElement;

function syncViewport() {
  if (window.innerWidth !== lastWidth) { lastWidth = window.innerWidth; fullHeight = 0; }
  if (!phoneMQ.matches) {
    root.classList.remove("compact");
    root.style.removeProperty("--app-vh");
    return;
  }
  const h = vv ? vv.height : window.innerHeight;
  if (h > fullHeight) fullHeight = h;
  const compact = h < fullHeight - 150;
  root.classList.toggle("compact", compact);
  if (compact) root.style.setProperty("--app-vh", h + "px");
  else root.style.removeProperty("--app-vh");
}

if (vv) {
  vv.addEventListener("resize", syncViewport);
  vv.addEventListener("scroll", syncViewport);
}
window.addEventListener("resize", syncViewport);
window.addEventListener("orientationchange", syncViewport);
if (phoneMQ.addEventListener) phoneMQ.addEventListener("change", syncViewport);
syncViewport();

renderTenseChips();
refreshGame();

["gesturestart", "gesturechange", "gestureend"].forEach((type) => {
  document.addEventListener(type, (e) => e.preventDefault(), { passive: false });
});
</script>
